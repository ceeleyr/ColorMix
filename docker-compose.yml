name: colormix

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: colormix-mosquitto
    ports:
      - "${MQTT_PORT:-1883}:1883"        # ESP32 connects here (use laptop IP)
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  influxdb:
    image: influxdb:1.8
    container_name: colormix-influxdb
    environment:
      - INFLUXDB_DB=colormix
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influx-data:/var/lib/influxdb
    # no host port: only Node-RED & Grafana (inside docker network) need it.
    # Uncomment to query from the host:  ports: ["8087:8086"]
    restart: unless-stopped

  nodered:
    build: ./node-red
    container_name: colormix-nodered
    depends_on: [mosquitto, influxdb]
    environment:
      - TZ=Asia/Jakarta
    ports:
      - "${NODERED_PORT:-1880}:1880"        # web: /  (generator), /scan.html, editor: /admin
    volumes:
      - ./node-red/data:/data
      - ./web:/web:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: colormix-grafana
    depends_on: [influxdb]
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/colormix.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  influx-data:
  grafana-data:
